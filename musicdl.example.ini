# musicdl settings
#
# Copy this file to "musicdl.ini" in the same folder as musicdl.py, then edit it.
# musicdl.ini is listed in .gitignore, so your paths and keys stay off GitHub.
# Lines starting with # are comments. Leave a value blank to use the default.
#
# Where a setting can come from, strongest first:
#   command-line flag  >  environment variable  >  this file  >  built-in default

[paths]
# Folder where songs are saved and tagged.
# Default: a "Music/musicdl" folder inside your home folder.
library = ~/Music/musicdl

# cookies.txt exported from your browser (Netscape format). Optional; it lets
# yt-dlp reach your private or liked playlists. Treat it like a password.
# Leave blank for no cookies.
cookies =

[general]
# A way to reach you (email or URL). MusicBrainz asks every program that uses
# it to include one in its requests.
contact =

# How several artists are joined in the artist field: "A / B".
# Put the value in quotes if it starts or ends with a space.
artist_separator = " / "

[keys]
# Leave any of these blank to skip that service.
# Environment variables with these names override what is written here:
#   MUSIXMATCH_API_KEY, GENIUS_ACCESS_TOKEN, ACOUSTID_API_KEY, THEAUDIODB_API_KEY

# Lyrics, first choice. Free key: https://developer.musixmatch.com
# (the free plan only returns about 30% of each song)
musixmatch =

# Lyrics, fallback. Create an API client at https://genius.com/api-clients
# and paste its "Client Access Token".
genius =

# Audio fingerprinting. Free key: https://acoustid.org/new-application
# Also needs Chromaprint's "fpcalc" on your PATH.
acoustid =

# TheAudioDB fallback. "2" is their shared free test key. Get your own at
# https://www.theaudiodb.com/api_apply.php if you hit limits.
theaudiodb = 2
